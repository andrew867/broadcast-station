<!doctype html><html lang="en"><head><meta charset="utf-8"><title>[[product_name]] map view</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101c25}img{width:100%;height:100%;object-fit:contain}p{position:absolute;left:3%;top:3%;color:#f4f0e7;font:22px Arial}</style><script src="/static/branding.js" defer></script></head><body><img id="map" alt="Information graphic"><p id="status">Preparing graphic...</p><script>
const scene=new URLSearchParams(location.search).get('scene')||'map';let previous;
async function refresh(){try{const r=await fetch('/api/maps/'+encodeURIComponent(scene)+'/image',{cache:'no-store'});if(!r.ok)throw Error();const url=URL.createObjectURL(await r.blob());const image=document.getElementById('map');image.onload=()=>{if(previous)URL.revokeObjectURL(previous);previous=url;document.getElementById('status').textContent=''};image.src=url}catch(e){document.getElementById('status').textContent='Graphics preview reconnecting...'}setTimeout(refresh,2000)}refresh();
</script></body></html>
